[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Command-line startup is run by hand, not by tests.
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["."]
exclude = ["^\\.venv/"]
# The code has few annotations; still type-check the bodies of unannotated functions.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
